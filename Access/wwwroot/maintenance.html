<title>We'll be right back | First Registrars</title>
<style>
  :root{--navy:#12416f;--navy-deep:#0b2c4d;--gold:#c49b36;--gold-soft:#f4ead3;--ink:#1d2433;--muted:#5d6678;--bg:#f6f7fb}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);
       display:flex;flex-direction:column;min-height:100vh}
  .band{height:6px;background:linear-gradient(90deg,var(--navy) 0 70%,var(--gold) 70% 100%)}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 16px}
  .card{width:100%;max-width:880px;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(18,65,111,.12);
        display:grid;grid-template-columns:1.05fr 1fr;overflow:hidden}
  .art{background:linear-gradient(160deg,var(--navy) 0%,var(--navy-deep) 100%);display:flex;align-items:center;justify-content:center;padding:36px;position:relative}
  .art svg{width:100%;max-width:340px;height:auto}
  .copy{padding:44px 40px;display:flex;flex-direction:column;justify-content:center}
  .logo{width:190px;height:auto;margin-bottom:28px}
  .tag{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:var(--gold-soft);color:#8a6a1f;
       font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:999px;margin-bottom:16px}
  .tag i{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:pulse 1.6s ease-in-out infinite}
  h1{font-size:30px;line-height:1.2;color:var(--navy);margin-bottom:14px}
  p{font-size:16px;line-height:1.6;color:var(--muted);margin-bottom:12px}
  .note{margin-top:14px;font-size:13px;color:#8890a0;display:flex;align-items:center;gap:8px}
  .spin{width:14px;height:14px;border:2px solid #d9dde7;border-top-color:var(--navy);border-radius:50%;animation:spin 1s linear infinite}
  footer{text-align:center;font-size:12px;color:#9aa1b0;padding:18px 16px 24px}
  .gear{transform-box:fill-box;transform-origin:center}
  .g1{animation:spin 9s linear infinite}.g2{animation:spin 6s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{50%{opacity:.35}}
  @media (max-width:720px){
    .card{grid-template-columns:1fr}
    .art{padding:28px 24px}.art svg{max-width:240px}
    .copy{padding:30px 24px}
    h1{font-size:24px}
    .logo{width:160px;margin-bottom:20px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
