name: Deploy Next.js to Azure App Service (Standard)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  # Exact App Service name from Azure Portal (Overview -> Name)
  AZURE_WEBAPP_NAME: Project-T
  AZUREAPPSERVICE_PUBLISHPROFILE: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate configuration
        run: |
          if [ -z "${AZURE_WEBAPP_NAME}" ]; then
            echo "AZURE_WEBAPP_NAME is empty. Set it in the workflow or repo variables." >&2
            exit 1
          fi
          echo "Deploying to App Service: ${AZURE_WEBAPP_NAME}"

      # Deploy source so App Service (Oryx) builds on server
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: .
